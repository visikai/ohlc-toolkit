version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Maintain dependencies for Python. This project has used uv since
  # 2026-08-27 (b82b14c); `uv` is the ecosystem that reads pyproject.toml
  # together with uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "12:00"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
