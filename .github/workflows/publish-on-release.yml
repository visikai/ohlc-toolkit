name: Publish on Release

on:
  release:
    types: [created]

env:
  # Managed installs so setup-uv cache-python can restore Python 3.14.7.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff check
        run: |
          uv run ruff format --check
          uv run ruff check .
      - name: MyPy check
        run: uv run mypy .
      - name: Run tests with pytest
        run: uv run pytest
      # The network lane fetches the real published dataset and runs the
      # README quickstart against it; a release must not ship while
      # either is broken.
      - name: Run the network-marked tests
        run: uv run pytest -m network

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: pypi
      url: https://pypi.org/project/ohlc-toolkit
    permissions:
      id-token: write # Note: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"
      - name: Build package
        run: uv build
      # uv build reads the version from pyproject.toml and ignores the
      # tag, so a tag that does not match the tree would publish a
      # version matching no tag. Fail before anything is uploaded.
      - name: Require the tag to match the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for artifact in "dist/ohlc_toolkit-${TAG}.tar.gz" "dist/ohlc_toolkit-${TAG}-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "tag '${TAG}' does not match the built artifacts:" >&2
              ls dist >&2
              exit 1
            fi
          done
      # Fail the release before anything is uploaded: the publish
      # action's own metadata check is non-strict.
      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
