name: Publish on Release

on:
  release:
    types: [created]

env:
  # Managed installs so setup-uv cache-python can restore Python 3.14.7.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff check
        run: |
          uv run ruff format --check
          uv run ruff check .
      - name: MyPy check
        run: uv run mypy .
      - name: Run tests with pytest
        run: uv run pytest
      # The network lane fetches the real published dataset and runs the
      # README quickstart against it; a release must not ship while
      # either is broken.
      - name: Run the network-marked tests
        run: uv run pytest -m network

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: pypi
      url: https://pypi.org/project/ohlc-toolkit
    permissions:
      id-token: write # Note: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"
      - name: Build package
        run: uv build
      # uv build reads the version from pyproject.toml and ignores the
      # tag, so a tag that does not match the tree would publish a
      # version matching no tag. Fail before anything is uploaded.
      - name: Require the tag to match the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for artifact in "dist/ohlc_toolkit-${TAG}.tar.gz" "dist/ohlc_toolkit-${TAG}-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "tag '${TAG}' does not match the built artifacts:" >&2
              ls dist >&2
              exit 1
            fi
          done
      # Fail the release before anything is uploaded: the publish
      # action's own metadata check is non-strict.
      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*
      # This is the only action in the repository that holds publishing
      # rights, and it was the only one still floating on a branch ref.
      # Pinning it needs one non-obvious check: the action builds its own
      # container reference from the ref it was called with, as
      # ghcr.io/pypa/gh-action-pypi-publish:<ref>, so a commit with no
      # published image would fail at run time. This commit has one, and it
      # is the same image release/v1 resolves to.
      #
      # To upgrade: read the newest release tag, dereference it to its
      # commit, confirm ghcr.io publishes that commit SHA as a tag, then
      # move the SHA and the version comment together. Dependabot raises
      # that bump for a SHA pin and cannot for a branch ref, but it moves
      # the SHA and the comment only -- the ghcr check is still yours.
      #
      # This pin also decays, which is the unusual part. ghcr keeps
      # commit-SHA tags for only the last few releases: measured against
      # the registry, v1.12.4 and newer resolve while v1.11.0 and older
      # 404. A pin left un-bumped past that window stops being runnable
      # at all, and it fails on the release path -- the only place this
      # workflow runs, and only after the tag and GitHub release already
      # exist. A branch ref could never 404. So Dependabot's bump has to
      # be MERGED, not merely raised. The network-marked test in
      # tests/test_workflow_pins.py checks the pinned image is still
      # published, and this workflow runs that lane before it deploys.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
