name: Test and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Managed installs so setup-uv cache-python can restore Python 3.14.7.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Ruff check
        run: |
          uv run ruff format --check
          uv run ruff check .

      - name: MyPy check
        run: uv run mypy . --ignore-missing-imports --check-untyped-defs

      - name: Run tests with pytest
        run: uv run pytest --cov-report=xml

      - name: Upload coverage to Codacy
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' # Only run on PRs
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ohlc-toolkit
    permissions:
      id-token: write # Note: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"

      - name: Build package
        run: uv build

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
