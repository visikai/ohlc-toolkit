name: Test and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Managed installs so setup-uv cache-python can restore matrix interpreters.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Ruff check
        run: |
          uv run ruff format --check
          uv run ruff check .

      - name: MyPy check
        run: uv run mypy .

      - name: Run tests with pytest
        run: uv run pytest --cov-report=xml

      # secrets cannot be referenced in steps.if. This step only sees a
      # boolean so the token stays off uv/pytest and off skipped matrix cells.
      - name: Check Codacy project token
        id: codacy-token
        if: matrix.python-version == '3.14'
        env:
          HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
        run: echo "available=$HAS_CODACY_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.14' && steps.codacy-token.outputs.available == 'true'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()
    steps:
      - name: Require successful test matrix
        env:
          TEST_MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$TEST_MATRIX_RESULT" = "success"

  # Packaging validation only -- nothing here uploads anywhere. Releases
  # upload via publish-on-release.yml alone. The job keeps the name
  # "publish" because that exact string is a required status check on
  # main; renaming it takes a branch-protection update, after which this
  # job should be called "build".
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"

      # A stale lockfile passes uv sync --frozen, so a version bump that
      # forgets the lockfile is otherwise caught nowhere.
      - name: Require the lockfile to be in sync
        run: uv lock --check

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*
