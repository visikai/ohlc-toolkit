[project]
name = "ohlc-toolkit"
version = "0.4.0"
description = "A flexible toolkit for working with OHLC data and generating custom timeframes from minute data."
authors = [{ name = "Mourits de Beer", email = "ff137@proton.me" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ohlc",
    "price",
    "candlestick",
    "financial",
    "market-data",
    "time-series",
]
dependencies = [
    "loguru>=0.7.3,<0.8.0",
    "orjson>=3.10.15,<4.0.0",
    "pandas>=2.3.0,<3.0.0",
    "polars>=1.35.0,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "tqdm>=4.66.4,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/visikai/ohlc-toolkit"
Documentation = "https://visikai.github.io/ohlc-toolkit/"
Repository = "https://github.com/visikai/ohlc-toolkit"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.2.0,<3.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-ruff>=0.5.0,<0.6.0",
    "ruff>=0.16.0,<0.17.0",
]

[tool.ruff]
line-length = 88
lint.pycodestyle.max-line-length = 120
lint.select = [
    "E",   # pycodestyle errors (style errors)
    "W",   # pycodestyle warnings (style warnings)
    "F",   # pyflakes (detect invalid Python code)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (detect likely bugs)
    "C",   # mccabe (code complexity)
    "N",   # pep8-naming (naming conventions)
    "D",   # pydocstyle (docstring style)
    "UP",  # pyupgrade (upgrade syntax)
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
lint.ignore = [
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "PLE1205", # False positive: Too many arguments for `logging` format string
]
target-version = "py311"
include = ["benchmarks/*.py", "examples/*.py", "src/*.py", "tests/*.py"]

[tool.pytest.ini_options]
testpaths = "tests"
# `-m 'not network'` deselects the network-touching tests by default. A
# `-m` given on the command line comes after these and wins, so
# `pytest -m network` runs exactly those.
addopts = "--cov --cov-report term --ruff --ruff-format -m 'not network'"
markers = [
    "network: fetches from the real published dataset release; deselected by default, run with `pytest -m network`",
]

[tool.coverage.report]
omit = ["tests/*", "examples/*"]
skip_covered = false
show_missing = true

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.12.4,<0.13"

[tool.mypy]
check_untyped_defs = true

# The two modules below are the only imports without types: both belong
# to the retiring pandas-era surface and are deleted at 1.0. Naming them
# here -- instead of a global --ignore-missing-imports -- means every
# OTHER unresolved import is an error again, so a typing regression in a
# first-party or maintained third-party import surfaces instead of being
# waved through.
[[tool.mypy.overrides]]
module = ["pandas.*", "tqdm.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/ohlc_toolkit"]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
